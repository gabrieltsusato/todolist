<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-xl">lock</span>

<button class="absolute right-3 text-secondary hover:text-on-surface flex items-center justify-center p-1" onclick="togglePasswordVisibility('reg-password', 'reg-eye-icon')" title="Alternar visibilidade" type="button">

<div class="h-1 rounded-full bg-surface-container-high transition-colors duration-200" id="bar-3"></div>
<div class="h-1 rounded-full bg-surface-container-high transition-colors duration-200" id="bar-4"></div>

</form><div class="hidden mt-4 p-3.5 rounded-lg bg-error-container text-on-error-container flex items-start gap-3 transition-all duration-200" id="feedback-alert"><span class="material-symbols-outlined text-xl flex-shrink-0 mt-0.5 text-error">error</span><div class="flex-1"><p class="font-label-md text-label-md text-error font-semibold" id="feedback-title">Credenciais inválidas</p><p class="font-body-sm text-body-sm text-on-error-container opacity-90 mt-0.5" id="feedback-desc">E-mail ou senha incorretos. Por favor, tente novamente.</p></div><button class="text-error hover:opacity-75 p-0.5" onclick="hideAlert()" type="button"><span class="material-symbols-outlined text-sm">close</span></button></div>

<script src="js/api.js"></script>
<script>
  let currentActiveTab = 'login';

  function switchTab(target) {
    currentActiveTab = target;
    hideAlert();

    const loginTabBtn = document.getElementById('tab-btn-login');
    const registerTabBtn = document.getElementById('tab-btn-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');

    if (target === 'login') {
      loginTabBtn.className = "py-2.5 rounded-md font-label-lg text-label-lg text-on-surface bg-surface-container-lowest shadow-sm flex items-center justify-center gap-2 transition-all duration-200";
      registerTabBtn.className = "py-2.5 rounded-md font-label-lg text-label-lg text-secondary hover:text-on-surface flex items-center justify-center gap-2 transition-all duration-200";
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
      authTitle.innerText = "Bem-vindo de volta";
      authSubtitle.innerText = "Organize seu dia com foco e facilidade";
    } else {
      registerTabBtn.className = "py-2.5 rounded-md font-label-lg text-label-lg text-on-surface bg-surface-container-lowest shadow-sm flex items-center justify-center gap-2 transition-all duration-200";
      loginTabBtn.className = "py-2.5 rounded-md font-label-lg text-label-lg text-secondary hover:text-on-surface flex items-center justify-center gap-2 transition-all duration-200";
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
      authTitle.innerText = "Comece gratuitamente";
      authSubtitle.innerText = "Crie sua conta em segundos e eleve sua produtividade";
    }
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = 'visibility';
    } else {
      input.type = 'password';
      icon.innerText = 'visibility_off';
    }
  }

  function checkPasswordStrength(password) {
    const bars = [
      document.getElementById('bar-1'),
      document.getElementById('bar-2'),
      document.getElementById('bar-3'),
      document.getElementById('bar-4')
    ];
    const label = document.getElementById('strength-label');
    
    // Reset colors
    bars.forEach(b => {
      b.className = "h-1 rounded-full bg-surface-container-high transition-colors duration-200";
    });

    if (!password) {
      label.innerText = 'Mínimo de 8 caracteres';
      label.className = 'font-label-sm text-label-sm text-secondary';
      return;
    }

    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    if (password.length < 8) {
      bars[0].classList.replace('bg-surface-container-high', 'bg-error');
      label.innerText = 'Senha muito curta (mín. 8)';
      label.className = 'font-label-sm text-label-sm text-error';
    } else if (score <= 2) {
      bars[0].classList.replace('bg-surface-container-high', 'bg-error');
      bars[1].classList.replace('bg-surface-container-high', 'bg-error');
      label.innerText = 'Força: Razoável';
      label.className = 'font-label-sm text-label-sm text-error';
    } else if (score === 3) {
      bars[0].classList.replace('bg-surface-container-high', 'bg-secondary');
      bars[1].classList.replace('bg-surface-container-high', 'bg-secondary');
      bars[2].classList.replace('bg-surface-container-high', 'bg-secondary');
      label.innerText = 'Força: Boa';
      label.className = 'font-label-sm text-label-sm text-secondary';
    } else {
      bars.forEach(b => b.classList.replace('bg-surface-container-high', 'bg-tertiary-container'));
      label.innerText = 'Força: Excelente';
      label.className = 'font-label-sm text-label-sm text-tertiary font-semibold';
    }
  }

  function showAlert(title, desc) {
    const alertBox = document.getElementById('feedback-alert');
    const titleEl = document.getElementById('feedback-title');
    const descEl = document.getElementById('feedback-desc');

    titleEl.innerText = title;
    descEl.innerText = desc;
    alertBox.classList.remove('hidden');
  }

  function hideAlert() {
    const alertBox = document.getElementById('feedback-alert');
    if (alertBox) alertBox.classList.add('hidden');
  }

  
    // ------------------------------------------------------------------
    // Envio dos formulários: agora chamam a API de verdade (js/api.js)
    // ------------------------------------------------------------------
    function messageFrom(err) {
      if (err.fieldErrors) {
        const first = Object.values(err.fieldErrors)[0];
        if (first) return first;
      }
      return err.message;
    }

    /** Desabilita o botão e troca o texto enquanto a requisição está em andamento. */
    function setSubmitting(form, busy, busyText) {
      const btn = form.querySelector('button[type="submit"]');
      const label = btn.querySelector('span');
      if (busy) { btn.dataset.label = label.textContent; label.textContent = busyText; }
      else { label.textContent = btn.dataset.label || label.textContent; }
      btn.disabled = busy;
      btn.classList.toggle('opacity-60', busy);
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      hideAlert();
      const form = event.target;
      setSubmitting(form, true, 'Entrando...');
      try {
        await TodoList.login(
          document.getElementById('login-email').value.trim(),
          document.getElementById('login-password').value
        );
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert('Não foi possível entrar', messageFrom(err));
        setSubmitting(form, false);
      }
    }

    async function handleRegisterSubmit(event) {
      event.preventDefault();
      hideAlert();
      const password = document.getElementById('reg-password').value;
      if (password.length < 8) {
        showAlert('Senha muito curta', 'A senha deve ter no mínimo 8 caracteres.');
        return;
      }
      const form = event.target;
      setSubmitting(form, true, 'Criando conta...');
      try {
        // O cadastro já devolve o token: o usuário entra logado
        await TodoList.register(
          document.getElementById('reg-name').value.trim(),
          document.getElementById('reg-email').value.trim(),
          password
        );
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert('Não foi possível criar a conta', messageFrom(err));
        setSubmitting(form, false);
      }
    }

    // Já está logado? Vai direto para o dashboard.
    if (TodoList.isLoggedIn()) window.location.replace('dashboard.html');
  </script></main>

</body></html>
